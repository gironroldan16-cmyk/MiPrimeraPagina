<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Contacto | Mi Primera Web
  </title>

  <link
    rel="stylesheet"
    href="estilos.css"
  >

</head>


<body>


  <!-- =========================
       MENÚ
  ========================== -->

  <header class="encabezado">

    <div class="logo">
      Mi Primera Web!
    </div>


    <nav class="menu">

      <a href="index.html">
        Inicio
      </a>

      <a href="nosotros.html">
        Nosotros
      </a>

      <a href="servicios.html">
        Servicios
      </a>

      <a href="contacto.html">
        Contacto
      </a>

    </nav>

  </header>



  <!-- =========================
       CONTACTO
  ========================== -->

  <section
    class="seccion contacto"
  >

    <div class="contenido">

      <p class="etiqueta">
        HABLEMOS
      </p>

      <h2>
        Contacto
      </h2>

      <p class="texto-contacto">
        Completa el formulario y
        envíanos tu mensaje.
      </p>



      <!-- =========================
           FORMULARIO
      ========================== -->

      <form
        id="formularioContacto"
        class="formulario-contacto"

        action="https://script.google.com/macros/s/AKfycbyaZkfrmKI_kRTHV9h6Tu19hi5_56x1GxnVLF0dlutodoB7HQtSBGL1282Q-NZoCqmRVA/exec"

        method="POST"

        target="respuestaOculta"

        onsubmit="prepararEnvio()"
      >


        <!-- NOMBRE -->

        <div class="grupo-campo">

          <label for="nombre">
            Nombre
          </label>

          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Escribe tu nombre"
            required
          >

        </div>



        <!-- CORREO -->

        <div class="grupo-campo">

          <label for="correo">
            Correo electrónico
          </label>

          <input
            type="email"
            id="correo"
            name="correo"
            placeholder="ejemplo@correo.com"
            required
          >

        </div>



        <!-- TELÉFONO -->

        <div class="grupo-campo">

          <label for="telefono">
            Teléfono
          </label>

          <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="+502 0000-0000"
          >

        </div>



        <!-- MENSAJE -->

        <div class="grupo-campo">

          <label for="mensaje">
            Mensaje
          </label>

          <textarea
            id="mensaje"
            name="mensaje"
            rows="6"
            placeholder="Escribe tu mensaje"
            required
          ></textarea>

        </div>



        <!-- BOTÓN -->

        <button
          type="submit"
          class="boton-enviar"
        >
          Enviar mensaje
        </button>


        <!-- CONFIRMACIÓN -->

        <p
          id="mensajeFormulario"
          class="mensaje-formulario"
        ></p>


      </form>



      <!-- RESPUESTA INVISIBLE -->

      <iframe
        name="respuestaOculta"
        id="respuestaOculta"
        style="display: none;"
        onload="confirmarEnvio()"
      ></iframe>


    </div>

  </section>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <p>
      © 2026 Mi primera página web
    </p>

  </footer>


  <script src="script.js"></script>


</body>

</html>
